<title>SR-Doku AUD²IT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1a2e">
<style>
/* Layout: sticky Kopf mit Timern + Status, darunter ACiLS-Buchstabenleiste als Navigation, eine Spalte Karten, auf Tablet zweispaltig */
:root{
  --bg:#eef2f7; --surface:#ffffff; --surface2:#f6f8fb; --line:#cfd8e4; --fg:#142033; --muted:#5d6b80;
  --red:#c4202a; --redsoft:#fbe9ea; --blue:#2c64ad; --bluesoft:#e7eef8; --orange:#e98a12; --orangesoft:#fdf1e1;
  --green:#1f8a52; --greensoft:#e4f4ea; --head:#0f1a2e; --headfg:#ffffff; --headmuted:#9fb0c8;
  --shadow:0 1px 2px rgba(20,32,51,.08),0 2px 8px rgba(20,32,51,.06);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --surface:#131d30; --surface2:#18243a; --line:#2a3a55; --fg:#e7edf6; --muted:#97a6bd;
  --red:#ef4b53; --redsoft:#3a1a20; --blue:#6aa0ea; --bluesoft:#1a2a45; --orange:#f3a43c; --orangesoft:#3a2a14;
  --green:#3fc07c; --greensoft:#153325; --head:#070d18; --headfg:#ffffff; --headmuted:#8798b3;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#131d30; --surface2:#18243a; --line:#2a3a55; --fg:#e7edf6; --muted:#97a6bd;
  --red:#ef4b53; --redsoft:#3a1a20; --blue:#6aa0ea; --bluesoft:#1a2a45; --orange:#f3a43c; --orangesoft:#3a2a14;
  --green:#3fc07c; --greensoft:#153325; --head:#070d18; --headfg:#ffffff; --headmuted:#8798b3;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);font-family:var(--sans)}
body{margin:0;font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* ---------- Kopf ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--headfg);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px 0}
.toprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.02em;font-size:15px;white-space:nowrap}
.brand small{display:block;font-weight:500;color:var(--headmuted);font-size:11px;letter-spacing:.04em}
.timers{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tm{background:rgba(255,255,255,.08);border-radius:8px;padding:3px 8px;min-width:76px}
.tm b{display:block;font:700 18px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.tm span{font-size:10px;color:var(--headmuted);text-transform:uppercase;letter-spacing:.06em}
.tm.warn b{color:#ffb547}
.statusrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:7px 0 6px}
.pill{border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.12);color:var(--headfg);border:0}
.pill.krit{background:#d6262f}.pill.stab{background:#1f8a52}.pill.ghost{background:transparent;border:1px dashed rgba(255,255,255,.35);color:var(--headmuted);font-weight:600}
.topbtns{display:flex;gap:6px;margin-left:auto}
.tbtn{background:rgba(255,255,255,.12);border:0;border-radius:8px;color:#fff;padding:7px 10px;font-weight:700;font-size:13px;min-height:36px}
.tbtn.primary{background:var(--red)}
/* Buchstabenleiste */
.steps{display:flex;gap:4px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.st{flex:1 0 auto;min-width:52px;border:0;border-radius:8px;background:#ffffff;color:#c4202a;padding:4px 8px 3px;text-align:center;
  box-shadow:inset 0 -3px 0 #b9c6d8;font-weight:900;font-size:19px;line-height:1.05}
.st small{display:block;font-size:9.5px;font-weight:700;color:#4a5870;letter-spacing:.03em;text-transform:uppercase}
.st.on{background:#c4202a;color:#fff;box-shadow:inset 0 -3px 0 #8e141b}
.st.on small{color:#ffd9db}
.st .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#1f8a52;margin-left:3px;vertical-align:super}

/* ---------- Inhalt ---------- */
main{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:12px 90px;max-width:1100px;margin:0 auto}
.grid{display:grid;gap:12px}
@media (min-width:820px){.grid.two{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:2px solid var(--blue);border-radius:var(--r);overflow:hidden;min-width:0}
.card.red{border-color:var(--red)}.card.orange{border-color:var(--orange)}.card.green{border-color:var(--green)}
.ch{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bluesoft)}
.card.red .ch{background:var(--red);color:#fff}
.card.orange .ch{background:var(--orangesoft)}.card.green .ch{background:var(--greensoft)}
.ltr{font-weight:900;font-size:26px;line-height:1;color:var(--red);min-width:26px;text-align:center}
.card.red .ltr{color:#fff}
.ch h2{margin:0;font-size:16px;font-weight:800;text-wrap:balance}
.ch .sub{font-size:12px;color:var(--muted);margin-left:auto;text-align:right}
.card.red .ch .sub{color:#ffe0e2}
.cb{padding:12px;display:grid;gap:10px}
.hint{font-size:12.5px;color:var(--muted)}
.stopp{background:var(--redsoft);border:2px solid var(--red);border-radius:var(--r);padding:10px 12px;font-weight:700}
.stopp b{color:var(--red)}
h3{margin:4px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}

/* Felder */
.fields{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.fields.wide{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.fld{display:grid;gap:3px;min-width:0}
.fld>span{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.fld input,.fld textarea,.fld select{width:100%;border:1.5px dashed var(--line);background:var(--surface2);border-radius:8px;padding:9px 10px;min-height:42px;font-size:16px}
.fld textarea{resize:vertical;min-height:64px}
.fld input:focus,.fld textarea:focus{border-style:solid;border-color:var(--blue);outline:none}
.fld input.bad{border-color:var(--red);border-style:solid}
.vit{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px}
.vit .fld input{font:700 17px var(--mono);text-align:center;padding:8px 4px}

/* Checks */
.chks{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.chk{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 10px;min-height:46px;width:100%}
.chk i{flex:0 0 22px;height:22px;border:2px solid var(--muted);border-radius:6px;position:relative}
.chk span{flex:1;font-weight:600}
.chk time{font:600 12px var(--mono);color:var(--muted)}
.chk.on{border-color:var(--green);background:var(--greensoft)}
.chk.on i{background:var(--green);border-color:var(--green)}
.chk.on i::after{content:"";position:absolute;left:6px;top:1px;width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}

/* Segmente */
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;align-content:flex-start}
.fld{align-content:start}
@media (max-width:520px){.brand small{display:none}.tm{min-width:0;flex:1}.timers{width:100%;margin-left:0}.tm b{font-size:16px}.statusrow{padding:5px 0 4px}}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;min-height:42px}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.seg.big button{flex:1;font-size:18px;padding:14px;border-radius:10px}
.seg button.on[data-val="kritisch"]{background:var(--red);border-color:var(--red)}
.seg button.on[data-val="stabil"]{background:var(--green);border-color:var(--green)}
.seg button.on[data-val="Problem"]{background:var(--red);border-color:var(--red)}
.seg button.on[data-val="o. B."]{background:var(--green);border-color:var(--green)}
.seg button.sugg{border-color:var(--orange);box-shadow:inset 0 0 0 2px var(--orange)}

/* cABCDE-Zeilen */
.abc{display:grid;gap:0}
.abcrow{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-top:1.5px dashed var(--line)}
.abcrow:first-child{border-top:0}
.abcrow .ltr{font-size:28px;padding-top:2px}
.abcrow .ltr.c{font-size:24px}
.abcin{display:grid;gap:8px;min-width:0}
.abct{font-weight:800}
.mq{display:grid;gap:8px;max-height:46vh;overflow:auto;padding-right:2px}
.mgrp{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.mgrp .ltr{font-size:22px;padding-top:6px}
.mq .seg button{min-height:38px;padding:6px 11px;font-size:14px}
.pdfbox{display:grid;gap:8px;background:var(--surface2);border:1.5px solid var(--line);border-radius:9px;padding:10px}
.pchk{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px}.pchk input{width:20px;height:20px}
.h3n{text-transform:none;letter-spacing:0;font-weight:500}
.seg.prio button{min-width:58px;font-size:19px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.ord{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--blue);font-size:12px;font-weight:900}
.prioline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border:1.5px dashed var(--line);border-radius:9px;min-height:46px}
.prioline.full{border:1.5px solid var(--green);background:var(--greensoft)}
.pchip{font-weight:900;font-size:20px;color:var(--red)}.pchip small{font-size:12px;color:var(--muted);margin-right:2px}
.arr{color:var(--muted);font-weight:700}.pstat{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:700}
.hl{color:var(--red);font-weight:900;font-size:14px;margin-right:2px}
.abct small{font-weight:600;color:var(--muted)}
@media (min-width:820px){.abcin.split{grid-template-columns:1fr 1fr}}
.mon{display:flex;flex-wrap:wrap;gap:6px}
.mon .chk{width:auto;flex:1 0 120px}

/* Buttons */
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;min-height:44px;background:var(--blue);color:#fff}
.btn.red{background:var(--red)}.btn.green{background:var(--green)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--fg)}
.btn.small{min-height:34px;padding:6px 10px;font-size:13px}
.big-go{width:100%;font-size:17px;padding:14px}

/* Listen */
.list{display:grid;gap:6px}
.li{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface)}
.li .t{font:600 12px var(--mono);color:var(--muted);white-space:nowrap;padding-top:2px}
.li .x{flex:1;min-width:0;overflow-wrap:anywhere}
.li.done .x{text-decoration:line-through;color:var(--muted)}
.li button{border:0;background:transparent;color:var(--muted);font-weight:800;padding:2px 6px}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;background:var(--surface2);border:1px solid var(--line)}
.tag.ok{background:var(--greensoft);border-color:var(--green)}.tag.no{background:var(--redsoft);border-color:var(--red)}.tag.q{background:var(--orangesoft);border-color:var(--orange)}
.tblwrap{overflow-x:auto}
table.vt{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.vt th,.vt td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.vt th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.vt td:first-child,.vt th:first-child{text-align:left}
.empty{color:var(--muted);font-style:italic;font-size:13.5px}

/* Protokoll */
.proto{font-size:14px}
.proto h4{margin:12px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--red)}
.proto p{margin:2px 0}
.proto .k{color:var(--muted)}
pre.txt{white-space:pre-wrap;font:13px/1.45 var(--mono);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:340px;overflow:auto}

/* Sheet */
.sheetbg{position:fixed;inset:0;background:rgba(5,10,20,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  max-height:88vh;overflow:auto;display:grid;gap:12px}
@media (min-width:700px){.sheetbg{align-items:center}.sheet{border-radius:16px}}
.sheet h2{margin:0;font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--head);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-weight:700;box-shadow:var(--shadow);max-width:90vw}
.warnbox{background:var(--orangesoft);border:1.5px solid var(--orange);border-radius:9px;padding:8px 10px;font-size:13.5px}
.foot{font-size:11.5px;color:var(--muted);text-align:center;padding:16px 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .top,.noprint,body::before{display:none!important}
  main{padding:0;max-width:none}
  .card{border:1px solid #999;break-inside:avoid}
  body,html{background:#fff;color:#000}
}
</style>

<header class="top" id="top">
  <div class="toprow">
    <div class="brand">SR-Doku <small>SINNHAFT · (PR_E-)AUD²IT</small></div>
    <div class="timers">
      <div class="tm" id="tmA"><b>--:--</b><span>seit Anmeldung</span></div>
      <div class="tm" id="tmE"><b>--:--</b><span>ETA</span></div>
      <div class="tm" id="tmS"><b>--:--</b><span>im Schockraum</span></div>
    </div>
  </div>
  <div class="statusrow">
    <span class="pill ghost" id="pZust">Zustand offen</span>
    <span class="pill ghost" id="pPrio">Prio –</span>
    <span class="pill ghost" id="pLeit">Leitsymptom –</span>
    <span class="pill ghost" id="pKg">kg –</span>
    <span class="pill ghost" id="pVit" hidden></span>
    <div class="topbtns">
      <button class="tbtn" data-act="vitals" title="Vitalwerte erfassen">+ Vitalwerte</button>
      <button class="tbtn primary" data-act="measure" title="Maßnahme / Medikament dokumentieren">+ Maßnahme</button>
    </div>
  </div>
  <nav class="steps" id="steps" aria-label="Ablauf"></nav>
</header>

<main id="view"></main>
<div id="layer"></div>

<script>
"use strict";
/* ================= Daten & Speicher ================= */
const KEY='srdoku_v1';
const blank=()=>({v:1,created:Date.now(),tab:'pr',
  pre:{tAnm:'',eta:'',rm:'',info:''},anmAt:null,etaAt:null,arrAt:null,uebEnd:null,
  chk:{},
  sinn:{I:{sex:'',name:'',age:'',wt:'',wtType:'',kind:''},N1:{was:'',wie:'',wann:'',wo:''},
    N2:{c:{f:'',h:''},A:{f:'',h:''},B:{f:'',h:''},C:{f:'',h:''},D:{f:'',h:''},E:{f:'',h:''}},
    v:{spo2:'',af:'',hf:'',rr:'',rekap:'',gcs:'',bz:'',temp:''},
    amp:{S:'',A:'',M:'',P:'',L:'',E:'',R:''},fazit:'',team:'',ttt:''},
  prim:{A:{st:'',f:'',h:''},B:{st:'',f:'',h:''},C:{st:'',f:'',h:''},D:{st:'',f:'',h:''},E:{st:'',f:'',h:''}},
  vit:[],
  tto2:{zust:'',prio:[],leit:[],leitFree:'',note:'',at:null},
  opq:{O:'',P:'',Q:'',R:'',S:'',T:''},
  unters:'',reass:[],
  dd:{ad:'',list:[]},
  diag:{},
  tto3:{plan:'',dispo:'',dispoFree:'',note:'',at:null},
  todo:[],meds:[],log:[]});
let S;const CKEY='srdoku_cfg';let CFG={pseudo:true};try{Object.assign(CFG,JSON.parse(localStorage.getItem(CKEY)||'{}'))}catch(e){}
function saveCfg(){try{localStorage.setItem(CKEY,JSON.stringify(CFG))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);S=merge(blank(),o);return}}catch(e){}S=blank()}
function norm(){const t=S.tto2;if(!Array.isArray(t.leit))t.leit=t.leit?[t.leit]:[];if(!Array.isArray(t.prio))t.prio=t.prio?[t.prio]:[]}
function merge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))merge(a[k],b[k]);else a[k]=b[k]}return a}
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},150)}
function g(p){return p.split('.').reduce((o,k)=>o==null?undefined:o[k],S)}
function sv(p,val){const ks=p.split('.');let o=S;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]]}o[ks[ks.length-1]]=val;save()}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const hm=t=>{if(!t)return '';const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const hms=t=>{if(!t)return '';const d=new Date(t);return hm(t)+':'+pad(d.getSeconds())};
const dur=ms=>{if(ms<0)ms=0;const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+pad(m):pad(m))+':'+pad(x)};
function log(text){S.log.push({t:Date.now(),x:text});save()}

/* ================= Inhalte (aus Poster + Flipchart 2.1) ================= */
const PREP=[['p_med','Notfallmedikamente'],['p_sono','Notfallsonographie'],['p_mat','Materialcheck'],['p_alarm','Alarmierung des Schockraumteams']];
const PSA=[['psa_hs','Einmalhandschuhe'],['psa_br','Schutzbrille'],['psa_mund','Mundschutz'],['psa_kit','ggf. Einmalkittel']];
const RES=[['r_its','Intensivstation'],['r_rad','Diagnostik (Radiologie)'],['r_blut','Blutprodukte'],['r_lab','Labor'],['r_op','OP']];
const TTO1=[['t1_team','Team komplett & gebrieft'],['t1_mat','Material / Notfallmedikamente gewichtsadaptiert'],['t1_res','Ressourcen (Radiologie, ITS, OP)'],['t1_warm','Wärmemanagement'],['t1_ang','Umgang mit Angehörigen / Eltern bzw. Bezugspersonen']];
const FSR=[['fsr_soz','Soziale Interaktion'],['fsr_atm','Atmung'],['fsr_haut','Hautkolorit'],['fsr_mon','Monitor']];
const N2=[['c','kritische Blutung',[]],['A','Atemweg',[]],['B','Atmung / Oxygenierung',[['spo2','SpO₂ %'],['af','AF /min']]],['C','Kreislauf / Hämodynamik',[['hf','HF /min'],['rr','RR mmHg'],['rekap','Rekap s']]],['D','Vigilanz / Neurologie',[['gcs','GCS'],['bz','BZ']]],['E','Exposure / Temperatur',[['temp','Temp °C']]]];
const AMP=[['A','Allergien'],['M','Medikamente'],['P','Vorgeschichte'],['L','Letzte orale Aufnahme'],['E','vorherige Ereignisse'],['R','Risikofaktoren']];
const PRIM=[['A','Airway','freie Atemwege'],['B','Breathing','Oxygenierung / Ventilation'],['C','Circulation','Hämodynamik'],['D','Disability','Vigilanz'],['E','Exposure & Environment','Entkleiden, Inspektion und Wärmemanagement']];
const MON=[['m_spo2','① SpO₂'],['m_ekg','② EKG'],['m_nibd','③ NIBD'],['m_temp','Temp.'],['m_lab','Labor'],['m_bga','Venöse BGA']];
const LEIT=['Dyspnoe','Schock','Vigilanzminderung','Thoraxschmerz','Bauchschmerz','anderes'];

function fld(p,label,o={}){const im=o.num?' inputmode="decimal"':'';const ph=o.ph?` placeholder="${esc(o.ph)}"`:'';
  if(o.ta)return `<label class="fld"><span>${label}</span><textarea data-bind="${p}" rows="${o.rows||2}"${ph}></textarea></label>`;
  return `<label class="fld"><span>${label}</span><input data-bind="${p}" type="${o.type||'text'}"${im}${ph} autocomplete="off"></label>`}
function chk(k,label){return `<button class="chk" data-chk="${k}" aria-pressed="false"><i></i><span>${esc(label||ALLCHK[k])}</span><time></time></button>`}
function seg(p,opts,cls=''){return `<div class="seg ${cls}" data-seg="${p}">${opts.map(o=>`<button data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div>`}
function card(ltr,title,body,o={}){return `<section class="card ${o.c||''}" ${o.id?`id="${o.id}"`:''}><div class="ch">${ltr?`<span class="ltr">${ltr}</span>`:''}<h2>${title}</h2>${o.sub?`<span class="sub">${o.sub}</span>`:''}</div><div class="cb">${body}</div></section>`}

/* ================= Protokoll ================= */
function line(k,v){return v?`${k}: ${v}`:null}
function chkLine(list){return list.filter(([k])=>S.chk[k]).map(([k,t])=>`${hm(S.chk[k])} ${t}`)}
function initials(n){return String(n||'').trim().split(/[\s-]+/).filter(Boolean).map(w=>w[0].toUpperCase()+'.').join('')}
function buildProt(o={}){const I=S.sinn.I,secs=[];const add=(h,l)=>secs.push({h,l:l.filter(Boolean)});
 add('Fall',[line('Erstellt',new Date(S.created).toLocaleString('de-DE')),line('Anmeldung',S.pre.tAnm||hm(S.anmAt)),line('ETA',S.pre.eta),line('Eintreffen',hm(S.arrAt)),line('Übergabe abgeschlossen',hm(S.uebEnd)),line('Rettungsmittel',S.pre.rm),line('Voranmeldung',S.pre.info)]);
 add('Vorbereitung (PR_ / TTO I)',[...chkLine([...PREP,...PSA,...RES,...TTO1,...FSR]),line('Ersteindruck',S.sinn.ttt)]);
 add('Übergabe – Identifikation',[line('Name',o.pseudo?initials(I.name):I.name),line('Alter',I.age),line('Geschlecht',I.sex),line('Patient',I.kind),I.wt?`Gewicht: ${I.wt} kg${I.wtType?' ('+I.wtType+')':''}`:null]);
 add('Übergabe – Notfallereignis',[line('Was',S.sinn.N1.was),line('Wie',S.sinn.N1.wie),line('Wann',S.sinn.N1.wann),line('Wo/Woher',S.sinn.N1.wo)]);
 const v=S.sinn.v;add('Übergabe – cABCDE / Handlung',[...N2.map(([L,t])=>{const n=S.sinn.N2[L];return (n.f||n.h)?`${L} ${t}: ${n.f||'–'}${n.h?' | Handlung: '+n.h:''}`:null}),
   [v.spo2&&'SpO₂ '+v.spo2,v.af&&'AF '+v.af,v.hf&&'HF '+v.hf,v.rr&&'RR '+v.rr,v.rekap&&'Rekap '+v.rekap,v.gcs&&'GCS '+v.gcs,v.bz&&'BZ '+v.bz,v.temp&&'Temp '+v.temp].filter(Boolean).join(' · ')||null]);
 add('Anamnese (SAMPLER)',[line('S Symptome',S.sinn.amp.S),...AMP.map(([k,t])=>line(k+' '+t,S.sinn.amp[k]))]);
 add('OPQRST',OPQ.map(([k,t])=>line(k+' '+t,S.opq[k])));
 add('Übergabe – Fazit / Teamfragen',[S.chk.f_done?hm(S.chk.f_done)+' Fazit durchgeführt':null,line('Fazit',S.sinn.fazit),S.chk.t_done?hm(S.chk.t_done)+' Teamfragen durchgeführt':null,line('Teamfragen',S.sinn.team)]);
 add('Erstversorgung ABCDE',[...PRIM.map(([L,t])=>{const p=S.prim[L];return (p.st||p.f||p.h)?`${L} ${t}: ${p.st||''}${p.f?' – '+p.f:''}${p.h?' | Maßnahme: '+p.h:''}`:null}),...chkLine(MON).map(x=>'Monitoring '+x)]);
 add('Team-Time-Out II',[S.tto2.at?'Durchgeführt: '+hm(S.tto2.at):null,line('Zustand',S.tto2.zust),line('Priorität',prioTxt()),line('Leitsymptom',leitTxt()),line('Zusammenfassung',S.tto2.note)]);

const HW=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const CP={'€':128,'‚':130,'„':132,'…':133,'‹':139,'‘':145,'’':146,'“':147,'”':148,'•':149,'–':150,'—':151,'›':155};
const REPL={'₂':'2','✓':'v','☑':'[x]','☐':'[ ]','→':'->','①':'1','②':'2','③':'3','≥':'>=','≤':'<=','×':'x'};
function pdfChars(str){let o=[];for(const ch of String(str)){const r=REPL[ch];if(r!==undefined){for(const c of r)o.push(c.charCodeAt(0));continue}
  const c=ch.codePointAt(0);if(c<128&&c>=32)o.push(c);else if(CP[ch])o.push(CP[ch]);else if(c>=160&&c<=255&&c!==173)o.push(c);else if(c===9)o.push(32);else o.push(63)}return o}
function cw(c,bold){const w=(c>=32&&c<=126)?HW[c-32]:556;return bold?w*1.07:w}
function tw(codes,size,bold){return codes.reduce((a,c)=>a+cw(c,bold),0)*size/1000}
function wrap(str,size,max,bold){const words=String(str).split(/\s+/);const lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(tw(pdfChars(t),size,bold)<=max){cur=t;continue}
    if(cur)lines.push(cur);cur=w;while(tw(pdfChars(cur),size,bold)>max){let k=cur.length;while(k>1&&tw(pdfChars(cur.slice(0,k)),size,bold)>max)k--;lines.push(cur.slice(0,k));cur=cur.slice(k)}}
  if(cur)lines.push(cur);return lines.length?lines:['']}
function pstr(str){return '('+pdfChars(str).map(c=>c===40||c===41||c===92?'\\'+String.fromCharCode(c):c>126?'\\'+c.toString(8).padStart(3,'0'):String.fromCharCode(c)).join('')+')'}
function makePdf(o){const W=595.28,H=841.89,M=42,MAXW=W-2*M;const pages=[];let ops=[],y=0;
  const stamp=new Date().toLocaleString('de-DE');
  const newPage=()=>{if(ops.length)pages.push(ops);ops=[];y=H-M;
    if(!pages.length){ops.push('0.77 0.13 0.16 rg',`${M} ${y-30} ${MAXW} 34 re f`,'1 1 1 rg',`BT /F2 15 Tf ${M+10} ${y-19} Td ${pstr('Schockraum-Protokoll')} Tj ET`,
      `BT /F1 8.5 Tf ${M+10} ${y-28} Td ${pstr('SINNHAFT-Übergabe · (PR_E-)AUD²IT · erstellt '+stamp)} Tj ET`);y-=48}
    else{ops.push('0.4 0.45 0.5 rg',`BT /F1 8 Tf ${M} ${y} Td ${pstr('Schockraum-Protokoll · Fortsetzung')} Tj ET`);y-=18}};
  const need=h=>{if(y-h<M+24)newPage()};
  const text=(t,x,size,bold,col)=>{ops.push(col||'0.08 0.13 0.2 rg',`BT /${bold?'F2':'F1'} ${size} Tf ${x.toFixed(1)} ${y.toFixed(1)} Td ${pstr(t)} Tj ET`)};
  newPage();
  for(const s of o.secs){if(!s.l.length)continue;need(32);y-=6;text(s.h.toUpperCase(),M,10,true,'0.77 0.13 0.16 rg');y-=4;ops.push('0.77 0.13 0.16 RG 0.6 w',`${M} ${y.toFixed(1)} m ${M+MAXW} ${y.toFixed(1)} l S`);y-=12;
    for(const l of s.l){const m=/^([^:]{1,34}): (.*)$/.exec(l);let lines,keyW=0;
      if(m&&s.h!=='Chronologie'){keyW=Math.min(150,tw(pdfChars(m[1]+':'),9,true)+6);lines=wrap(m[2],9,MAXW-keyW,false)}else lines=wrap(l,9,MAXW,false);
      need(lines.length*12);
      lines.forEach((ln,i)=>{if(i===0&&keyW)text(m[1]+':',M,9,true,'0.36 0.42 0.5 rg');text(ln,M+keyW,9,false);y-=12})}
    y-=4}
  if(ops.length)pages.push(ops);
  const objs=[];const add=s=>{objs.push(s);return objs.length};
  const cat=add('<< /Type /Catalog /Pages 2 0 R >>');add('PAGES');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  const kids=[];pages.forEach((p,i)=>{const foot=['0.4 0.45 0.5 rg',`BT /F1 7.5 Tf ${M} 24 Td ${pstr('Dokumentationshilfe, kein Medizinprodukt. Ersetzt nicht die Dokumentation im KIS.')} Tj ET`,`BT /F1 7.5 Tf ${W-M-40} 24 Td ${pstr('Seite '+(i+1)+'/'+pages.length)} Tj ET`];
    const c=[...p,...foot].join('\n');const ci=add(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`);
    kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${ci} 0 R >>`))});
  objs[1]=`<< /Type /Pages /Kids [${kids.map(k=>k+' 0 R').join(' ')}] /Count ${kids.length} >>`;
  let out='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';const offs=[];objs.forEach((ob,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${ob}\nendobj\n`});
  const xr=out.length;out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(x=>String(x).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root ${cat} 0 R >>\nstartxref\n${xr}\n%%EOF`;
  const b=new Uint8Array(out.length);for(let i=0;i<out.length;i++)b[i]=out.charCodeAt(i)&255;return b}

 sheet(`<h2>${kind?'Reassessment · ':''}Vitalwerte · ${hm(Date.now())}</h2>
 <div class="vit">${f('spo2','SpO₂ %')}${f('af','AF /min')}${f('hf','HF /min')}${f('sys','RR sys')}${f('dia','RR dia')}${f('rekap','Rekap s')}${f('gcs','GCS')}${f('bz','BZ')}${f('temp','Temp °C')}</div>
 <div class="fld"><span>BZ-Einheit</span><div class="seg" id="bzU"><button data-u="mg/dl" class="on">mg/dl</button><button data-u="mmol/l">mmol/l</button></div></div>
 ${kind?`<label class="fld"><span>Notiz zum Reassessment</span><input id="v_note" autocomplete="off"></label>`:''}
 <div id="vWarn"></div>
 <div class="row"><button class="btn ghost" data-close>Abbrechen</button><button class="btn" id="vSave">Speichern</button></div>`,bg=>{
  let unit='mg/dl',forced=false;
  bg.querySelector('#bzU').onclick=e=>{const b=e.target.closest('button');if(!b)return;unit=b.dataset.u;bg.querySelectorAll('#bzU button').forEach(x=>x.classList.toggle('on',x===b))};
  bg.querySelector('#vSave').onclick=()=>{const val=k=>bg.querySelector('#v_'+k).value.trim().replace(',','.');
   const o={t:Date.now(),src:kind||'',spo2:val('spo2'),af:val('af'),hf:val('hf'),sys:val('sys'),dia:val('dia'),rekap:val('rekap'),gcs:val('gcs'),bz:val('bz'),bzU:'',temp:val('temp')};
   if(o.bz)o.bzU=unit;
   const issues=[];bg.querySelectorAll('.vit input').forEach(x=>x.classList.remove('bad'));
   for(const k in PLAUS){if(o[k]==='')continue;const n=Number(o[k]);if(isNaN(n)||n<PLAUS[k][0]||n>PLAUS[k][1]){issues.push(k);bg.querySelector('#v_'+k).classList.add('bad')}}
   if(o.gcs&&!/^\d+$/.test(o.gcs)){issues.push('gcs');bg.querySelector('#v_gcs').classList.add('bad')}
   if(o.bz){const n=Number(o.bz);const r=unit==='mg/dl'?[5,2000]:[0.3,111];if(isNaN(n)||n<r[0]||n>r[1]){issues.push('bz');bg.querySelector('#v_bz').classList.add('bad')}}
   if(o.sys&&o.dia&&Number(o.dia)>=Number(o.sys)){issues.push('rr');bg.querySelector('#v_dia').classList.add('bad')}
   const any=['spo2','af','hf','sys','rekap','gcs','bz','temp'].some(k=>o[k]!=='');
   if(!any&&!kind){bg.querySelector('#vWarn').innerHTML='<div class="warnbox">Bitte mindestens einen Wert eintragen.</div>';return}
   if(issues.includes('gcs')){bg.querySelector('#vWarn').innerHTML='<div class="warnbox">GCS muss eine ganze Zahl von 3 bis 15 sein.</div>';return}
   if(issues.length&&!forced){forced=true;bg.querySelector('#vWarn').innerHTML='<div class="warnbox">Rot markierte Werte sind technisch unplausibel (Tippfehler?). Korrigieren oder nochmals „Speichern“ tippen, um sie trotzdem zu übernehmen.</div>';return}
   if(any)S.vit.push(o);
   if(kind){const note=(bg.querySelector('#v_note')||{}).value||'';S.reass.push({t:o.t,x:'Reassessment'+(note?': '+note:'')});log('Reassessment'+(note?': '+note:''))}
   if(any)log('Vitalwerte: '+[o.spo2&&'SpO₂ '+o.spo2,o.af&&'AF '+o.af,o.hf&&'HF '+o.hf,o.sys&&'RR '+o.sys+'/'+o.dia,o.rekap&&'Rekap '+o.rekap,o.gcs&&'GCS '+o.gcs,o.bz&&'BZ '+o.bz+' '+o.bzU,o.temp&&'Temp '+o.temp].filter(Boolean).join(' · '));
   save();closeSheet();render();toast('Gespeichert')}})}

const MEAS=[
 ['A','Atemweg',['Absaugen','Guedel-Tubus','Wendl-Tubus','Larynxmaske','Intubation (RSI)','HWS-Immobilisation']],
 ['B','Atmung',['O₂ Nasenbrille','O₂ Maske mit Reservoir','NIV','Beutel-Masken-Beatmung','Entlastungspunktion','Thoraxdrainage']],
 ['C','Kreislauf',['pVK','i.o.-Zugang','Arterie','ZVK','Volumen kristalloid','Blutprodukte','Tourniquet','Beckenschlinge','Katecholamin-Perfusor','Kardioversion / Defibrillation']],
 ['D','Neurologie',['BZ-Messung','Glukose','Antikonvulsivum']],
 ['E','Exposure',['Wärmeerhalt','Wundversorgung','Blasenkatheter','Magensonde']],
 ['M','Medikamente',['Analgesie','Sedierung','Antiemese','Antibiose']]];
function measureSheet(){const recent=[...new Set(S.meds.map(m=>m.x))].slice(-6).reverse();
 sheet(`<h2>Maßnahme / Medikament</h2>
 <div class="mq">${MEAS.map(([L,t,xs])=>`<div class="mgrp"><span class="ltr" title="${t}">${L}</span><div class="seg">${xs.map(x=>`<button data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>`).join('')}</div>
 ${recent.length?`<div class="fld"><span>Zuletzt verwendet</span><div class="seg">${recent.map(r=>`<button data-q="${esc(r)}" data-full="1">${esc(r)}</button>`).join('')}</div></div>`:''}
 <label class="fld"><span>Was – Details ergänzen (Dosis, Weg, Lage …)</span><input id="mIn" placeholder="Schnellauswahl antippen oder frei eingeben" autocomplete="off"></label>
 <div class="fld"><span>Uhrzeit</span><div class="row" style="flex-wrap:nowrap"><input id="mT" type="time" style="flex:1"><button class="btn" id="mNow" type="button">Jetzt</button></div><span class="hint" id="mTh">Leer = Zeitpunkt des Speicherns</span></div>
 <div class="row"><button class="btn ghost" data-close>Abbrechen</button><button class="btn red" id="mSave">Dokumentieren</button></div>`,bg=>{
  const inp=bg.querySelector('#mIn'),tm=bg.querySelector('#mT');
  bg.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{bg.querySelectorAll('[data-q]').forEach(x=>x.classList.toggle('on',x===b));
    inp.value=b.dataset.full?b.dataset.q:b.dataset.q+' ';inp.classList.remove('bad');inp.focus();try{inp.setSelectionRange(inp.value.length,inp.value.length)}catch(e){}});
  const setNow=()=>{tm.value=hm(Date.now());bg.querySelector('#mTh').textContent='Jetzt gesetzt: '+tm.value};
  bg.querySelector('#mNow').onclick=setNow;
  const go=()=>{const x=inp.value.trim();if(!x){inp.classList.add('bad');return}const t=timeToday(tm.value)||Date.now();
   S.meds.push({t,x});S.meds.sort((a,b)=>a.t-b.t);S.log.push({t,x:'Maßnahme: '+x});save();closeSheet();render();toast('Dokumentiert: '+hm(t)+' '+x)};
  bg.querySelector('#mSave').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()}})}

/* Wake Lock: Display bleibt an, solange die Seite sichtbar ist */
async function wake(){try{if('wakeLock' in navigator&&document.visibilityState==='visible')await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',wake);

load();norm();render();wake();
</script>
